<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<script>try{var t=localStorage.getItem("ayadati-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>الصفحة غير موجودة | عيادتي</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;background:#F4FAFC;color:#0A2540;text-align:center;padding:16px}
a{color:#fff;background:#1287A0;padding:12px 24px;border-radius:999px;text-decoration:none;font-weight:700;display:inline-block;margin-top:12px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:#07131C;color:#E8F3F8}}:root[data-theme="dark"] body{background:#07131C;color:#E8F3F8}:root[data-theme="light"] body{background:#F4FAFC;color:#0A2540}
/* theme toggle */
.theme-btn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;border:1px solid rgba(127,127,127,.4);background:rgba(127,127,127,.14);color:inherit;cursor:pointer;padding:0;font:inherit}
.theme-btn:hover{border-color:currentColor}.theme-btn:focus-visible{outline:3px solid #1287A0;outline-offset:2px}
.theme-btn .ic{width:20px;height:20px}.theme-btn .s{display:none}
:root[data-theme="dark"] .theme-btn .m{display:none}:root[data-theme="dark"] .theme-btn .s{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme-btn .m{display:none}:root:not([data-theme="light"]) .theme-btn .s{display:block}}
.theme-float{position:fixed;top:14px;left:14px;z-index:100;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
</style></head>
<body>
<button type="button" class="theme-btn theme-float" data-theme-toggle aria-label="تبديل الوضع الليلي والنهاري"><svg class="ic m" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg><svg class="ic s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg></button><main><h1>الصفحة غير موجودة</h1><p>الرابط الذي فتحته غير صحيح أو تم نقله.</p><a href="./">العودة إلى عيادتي</a></main><script>(function(){var R=document.documentElement,bs=document.querySelectorAll('[data-theme-toggle]');function cur(){return R.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}function go(){var n=cur()==='dark'?'light':'dark';R.setAttribute('data-theme',n);try{localStorage.setItem('ayadati-theme',n)}catch(e){}window.dispatchEvent(new Event('themechange'))}for(var i=0;i<bs.length;i++)bs[i].addEventListener('click',go)})();</script>
</body></html>
